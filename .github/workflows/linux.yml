name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: read          # same-workflow run/artifact lookups

jobs:
  decide:
    name: CI decision
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      run-id: ${{ steps.decide.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags may predate these helpers; load them from the default branch.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: decide
        with:
          script: |
            await require('./.github/ci/decide.cjs')({
              github, context, core, workflow: 'linux.yml',
              packages: ["opentyrian-linux-x86_64", "opentyrian-linux-arm64"]
            });

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    permissions:
      contents: read
    name: Linux (${{ matrix.arch }})
    # 22.04 on purpose: the binary needs a glibc no newer than the one it was
    # built against, so building on the oldest supported runner is what lets
    # it run on more machines.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one arch failing must not cancel the other
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    # Job-level, so EVERY step that runs make/pkg-config sees the source-built
    # static SDL3 under build/sdl.  While this was set only on the "Compile
    # check" step, a later `make install` re-evaluated the Makefile without it:
    # pkg-config then found no `sdl3` package, so the rebuild lost its include
    # flags and died with `SDL3/SDL_stdinc.h: No such file or directory`.
    # PKG_CONFIG_PATH only *prepends* to pkg-config's search path, so the
    # distro's .pc files are still found, and make_linux.sh re-exports exactly
    # this same $PWD/build/sdl/lib/pkgconfig for its own build, so the two do
    # not fight.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/build/sdl/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe --tags for the version string
      - name: Install dependencies
        # Ubuntu 22.04 has no libsdl3 package, so the -Werror compile check
        # below links the SDL3 that make_linux.sh builds from source (cached
        # under build/sdl).  These -dev packages are HEADERS for SDL3's
        # dlopen()ed backends (X11, Wayland, PipeWire/PulseAudio/ALSA, ...);
        # nothing from them is linked into the binary.
        #
        # The X11 extension headers are HARD requirements of SDL3 3.4.16's
        # CheckX11 (cmake/sdlchecks.cmake): unlike every other backend, which
        # just warns and disables itself when a header is absent, each enabled
        # X11 extension calls SDL_missing_dependency() and stops CMake with a
        # FATAL_ERROR.  So they must all be present: XCURSOR (libxcursor-dev),
        # XDBE/XSYNC/XSHAPE (Xdbe.h, sync.h, shape.h in libxext-dev), XINPUT
        # (libxi-dev), XFIXES (libxfixes-dev), XRANDR (libxrandr-dev),
        # XSCRNSAVER (libxss-dev) and XTEST (libxtst-dev).  This mirrors the
        # docs/README-linux.md build-dependency list, which also ships
        # libxtst-dev.
        #
        # libudev-dev and libusb-1.0-0-dev enable the controller backends the
        # Steam Deck needs: udev/hidraw for the built-in controller and the
        # HIDAPI/libusb path for USB controllers (both dlopen()ed at run time).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl unzip \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libgbm-dev libdrm-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev wayland-protocols \
            libpipewire-0.3-dev
      - name: Cache static SDL3 build
        uses: actions/cache@v6
        with:
          path: build/sdl
          key: sdl3-static-${{ matrix.arch }}-${{ hashFiles('make_linux.sh') }}
      - name: Build static SDL3 + SDL3_net (deps only)
        run: ./make_linux.sh --deps-only
      - name: Compile check (debug, -Werror, source-built SDL3)
        run: make -j"$(nproc)" debug
      - name: Smoke test
        run: ./opentyrian --help
      - name: Test install/uninstall
        run: |
          DESTDIR=$(mktemp -d)
          make install DESTDIR="$DESTDIR"
          make uninstall DESTDIR="$DESTDIR"
          find "$DESTDIR" -type f | grep . && exit 1
          rm -rf "$DESTDIR"
      - name: Cache game data
        # The reference data is the official Tyrian 2.1 zip fetched by
        # ./get_data.sh.  Key the cache on the data lock's manifest hash, so a
        # manifest change (a new reference data set) misses the cache and
        # re-downloads; ./get_data.sh is idempotent and tools/regress.sh
        # verifies the restored copy against the same manifest before running.
        uses: actions/cache@v6
        with:
          path: data
          key: tyrian21-data-${{ hashFiles('test/regress/data-manifest.txt') }}
      - name: Fetch game data
        run: ./get_data.sh
      - name: Build (make_linux.sh, static SDL3)
        run: ./make_linux.sh
      - name: Regression suite
        # Release fallback preserves the existing package-only build path;
        # normal release runs reuse the packages without entering this job.
        if: github.event_name != 'release'
        # The normal pass includes the representative replay/interp identity
        # cases.  The full --replay-check/--interp-check sweeps are in the
        # manually triggered "Regression (full sweeps)" workflow.
        env:
          REGRESS_SKIP_BUILD: "1"   # make_linux.sh already built ./opentyrian
        # Case workers default to the runner CPU count (REGRESS_JOBS overrides it).
        run: make regress
      - name: Upload regression output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-actual-linux-${{ matrix.arch }}
          path: |
            test/regress/actual/*.txt
            test/regress/actual/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Fetch Tyrian 2000 data (download, verify, no cache)
        # Downloaded from the author's site in EVERY run and verified (size,
        # SHA-256, safe extraction, runtime manifest) by the script, into the
        # runner's temp dir, outside the checkout.  Never cached (a public
        # repo's Actions cache is readable from fork PRs), never uploaded and
        # never staged by the Package steps below.  A failed download or check
        # fails the job: it is not a skipped suite.
        if: github.event_name != 'release'
        run: |
          T2000_DIR="$RUNNER_TEMP/tyrian2000"
          tools/fetch_t2000_data.sh "$T2000_DIR"
      - name: Regression suite (Tyrian 2000)
        if: github.event_name != 'release'
        env:
          REGRESS_SKIP_BUILD: "1"   # same binary the 2.1 suite just ran
        run: |
          T2000_DIR="$RUNNER_TEMP/tyrian2000"
          make regress-2000 TYRIAN2000_DATA="$T2000_DIR"
      - name: Upload Tyrian 2000 regression output on failure
        # Only the code-owned hash files and the engine logs (top level of
        # actual/; no globstar).  NOT the .sav (it holds the HDT default names),
        # screenshots, audio dumps or anything under save-*/.
        if: failure() && github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: regression-2000-actual-linux-${{ matrix.arch }}
          path: |
            test/regress-2000/actual/*.txt
            test/regress-2000/actual/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Guard - no Tyrian 2000 data in the tree
        # Also part of `make regress`, but that is skipped on release events and
        # runs before the Tyrian 2000 data was ever on the runner.  Cheap, so run
        # it right before anything is packaged, on every event.
        run: tools/check_no_t2000_data.sh
      - name: Package (binary + game data + Steam Deck readme)
        run: |
          mkdir -p dist/opentyrian/licenses
          cp opentyrian dist/opentyrian/
          cp -r data dist/opentyrian/data
          cp COPYING dist/opentyrian/
          cp linux/README-steamdeck.txt dist/opentyrian/README-steamdeck.txt
          cp doc/tyrian-freeware-license.txt dist/opentyrian/licenses/Tyrian.txt
          # SDL3 and SDL3_net are linked in statically, so their licenses ship too
          cp build/sdl/share/licenses/SDL3.txt dist/opentyrian/licenses/
          cp build/sdl/share/licenses/SDL3_net.txt dist/opentyrian/licenses/
          tar -czf "opentyrian-linux-${{ matrix.arch }}.tar.gz" -C dist opentyrian
      - name: Extract the package
        run: mkdir -p pkgtest && tar -xzf "opentyrian-linux-${{ matrix.arch }}.tar.gz" -C pkgtest
      - name: Verify the package is self-contained
        # In a bare Debian container: no SDL, no libdecor, nothing installed.
        # The runner itself proves nothing here - it has all of those, and a
        # missing dependency would be silently satisfied.
        run: docker run --rm -v "$PWD/pkgtest:/pkg:ro" -w / debian:bookworm-slim /pkg/opentyrian/opentyrian --help
      - name: Upload the package (release builds and manual runs only)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: opentyrian-linux-${{ matrix.arch }}
          path: opentyrian-linux-${{ matrix.arch }}.tar.gz
          retention-days: 3

  release:
    name: Attach release packages
    needs: [decide, build]
    if: >-
      always() && github.event_name == 'release' && needs.decide.result == 'success' &&
      (needs.decide.outputs.run-id != '' || needs.build.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # only this job attaches release assets
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download only package artifacts (reused push or fallback build)
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.decide.outputs.run-id || github.run_id }}
          pattern: opentyrian-linux-*
          path: release-packages
          merge-multiple: true
      - name: Attach original package bytes with the release tag in the name
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/ci/attach.cjs')({
              github, context, core,
              packages: ["opentyrian-linux-x86_64.tar.gz", "opentyrian-linux-arm64.tar.gz"]
            });
