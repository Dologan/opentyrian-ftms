name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: read          # same-workflow run/artifact lookups

jobs:
  decide:
    name: CI decision
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      run-id: ${{ steps.decide.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A release runs the workflow file at the tagged commit, and that commit
          # carries the matching .github/ci helpers. (The default branch may not:
          # in this fork it still holds the upstream OpenTyrian workflows only.)
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: decide
        with:
          script: |
            await require('./.github/ci/decide.cjs')({
              github, context, core, workflow: 'windows.yml',
              packages: ["opentyrian-windows-x86_64"]
            });

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    permissions:
      contents: read
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one arch failing must not cancel the other
      matrix:
        # x86_64 only.  Windows on ARM runs this build through the OS's x64
        # emulation; the native arm64 job (windows-11-arm, CLANGARM64,
        # mingw-w64-clang-aarch64) was dropped in 2026-09 for its low adoption
        # and its slow, flaky emulated MSYS2 setup.
        include:
          - { runner: windows-latest, arch: x86_64, msystem: UCRT64,     prefix: mingw-w64-ucrt-x86_64 }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe --tags for the version string
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # `update` defaults to false, which leaves pacman on the base image's
          # stale package database; that database knows `*-sdl3` 3.4.16 but not
          # the newer `*-sdl3-net` ("error: target not found").  `update: true`
          # runs `pacman -Syu` first ("update the package database and all
          # already installed packages" per the action docs), so the install
          # list below resolves.  The action's built-in cache (default on)
          # still caches the resulting environment between runs.
          update: true
          install: >-
            make git curl unzip zip diffutils perl python
            ${{ matrix.prefix }}-cc
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-sdl3
            ${{ matrix.prefix }}-sdl3-net
      - name: Compile check (debug, -Werror)
        run: make -j"$(nproc)" debug
      - name: Smoke test
        run: ./opentyrian.exe --help
      - name: Cache game data
        # Keyed on the data lock's manifest hash (the official Tyrian 2.1 zip
        # fetched by ./get_data.sh); a manifest change re-downloads and the
        # script is a no-op when the cache hits.
        uses: actions/cache@v6
        with:
          path: data
          key: tyrian21-data-${{ hashFiles('test/regress/data-manifest.txt') }}
      - name: Fetch game data
        run: ./get_data.sh
      - name: Build (release)
        run: |
          make clean
          make -j"$(nproc)"
      - name: Smoke test
        run: ./opentyrian.exe --help
      - name: Regression suite
        # Release fallback preserves the existing package-only build path;
        # normal release runs reuse the packages without entering this job.
        if: github.event_name != 'release'
        # Normal pass; the full --replay-check/--interp-check sweeps live in the
        # manually triggered "Regression (full sweeps)" workflow.
        env:
          REGRESS_SKIP_BUILD: "1"   # built just above with the release flags
        # Case workers default to the runner CPU count (REGRESS_JOBS overrides it).
        run: make regress
      - name: Upload regression output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-actual-windows-${{ matrix.arch }}
          path: |
            test/regress/actual/*.txt
            test/regress/actual/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Fetch Tyrian 2000 data (download, verify, no cache)
        # Downloaded from the author's site in EVERY run and verified (size,
        # SHA-256, safe extraction, runtime manifest) by the script, into the
        # runner's temp dir, outside the checkout.  Never cached (a public
        # repo's Actions cache is readable from fork PRs), never uploaded and
        # never staged by the Package steps below.  A failed download or check
        # fails the job: it is not a skipped suite.
        if: github.event_name != 'release'
        run: |
          T2000_DIR="$(cygpath -u "$RUNNER_TEMP")/tyrian2000"
          tools/fetch_t2000_data.sh "$T2000_DIR"
      - name: Regression suite (Tyrian 2000)
        if: github.event_name != 'release'
        env:
          REGRESS_SKIP_BUILD: "1"   # same binary the 2.1 suite just ran
        run: |
          T2000_DIR="$(cygpath -u "$RUNNER_TEMP")/tyrian2000"
          make regress-2000 TYRIAN2000_DATA="$T2000_DIR"
      - name: Upload Tyrian 2000 regression output on failure
        # Only the code-owned hash files and the engine logs (top level of
        # actual/; no globstar).  NOT the .sav (it holds the HDT default names),
        # screenshots, audio dumps or anything under save-*/.
        if: failure() && github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: regression-2000-actual-windows-${{ matrix.arch }}
          path: |
            test/regress-2000/actual/*.txt
            test/regress-2000/actual/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Guard - no Tyrian 2000 data in the tree
        # Also part of `make regress`, but that is skipped on release events and
        # runs before the Tyrian 2000 data was ever on the runner.  Cheap, so run
        # it right before anything is packaged, on every event.
        run: tools/check_no_t2000_data.sh
      - name: Package (exe + DLLs + game data)
        run: |
          mkdir -p dist/opentyrian/licenses
          cp opentyrian.exe dist/opentyrian/
          # bundle every non-system DLL the exe needs (SDL3, SDL3_net, compiler runtime)
          ldd opentyrian.exe | grep -iv "system32\|/c/windows" | awk '{print $3}' | sort -u | xargs -I{} cp {} dist/opentyrian/
          cp -r data dist/opentyrian/data
          cp COPYING dist/opentyrian/COPYING.txt
          cp doc/tyrian-freeware-license.txt dist/opentyrian/licenses/Tyrian.txt
          for pkg in SDL3 SDL3_net; do
            cp "$MINGW_PREFIX/share/licenses/$pkg/LICENSE.txt" "dist/opentyrian/licenses/$pkg.txt"
          done
          cd dist && zip -r "../opentyrian-windows-${{ matrix.arch }}.zip" opentyrian
      - name: Extract the package
        run: mkdir -p /tmp/pkgtest && unzip -q "opentyrian-windows-${{ matrix.arch }}.zip" -d /tmp/pkgtest
      - name: Verify the package runs from a clean directory
        run: cd / && /tmp/pkgtest/opentyrian/opentyrian.exe --help
      - name: Upload the package (release builds and manual runs only)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: opentyrian-windows-${{ matrix.arch }}
          path: opentyrian-windows-${{ matrix.arch }}.zip
          retention-days: 3

  release:
    name: Attach release packages
    needs: [decide, build]
    if: >-
      always() && github.event_name == 'release' && needs.decide.result == 'success' &&
      (needs.decide.outputs.run-id != '' || needs.build.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # only this job attaches release assets
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only package artifacts (reused push or fallback build)
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.decide.outputs.run-id || github.run_id }}
          pattern: opentyrian-windows-*
          path: release-packages
          merge-multiple: true
      - name: Attach original package bytes with the release tag in the name
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/ci/attach.cjs')({
              github, context, core,
              packages: ["opentyrian-windows-x86_64.zip"]
            });
